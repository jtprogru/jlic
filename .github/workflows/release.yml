name: Release

on:
  push:
    tags:
      - 'v*'

# Permissions are granted per job: only `release` needs to write to this
# repository, and `homebrew` works exclusively against the tap via a PAT.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 1. Cross-target build matrix. Each job produces a .tar.gz + .sha256.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.target }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          # Cross-compiled on the arm64 runner — macos-13 (the last hosted
          # Intel runner) has very long queue times and is being phased out.
          # Apple Silicon's system toolchain cross-builds x86_64-apple-darwin
          # natively, no extra setup needed beyond `rustup target add`.
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      # Sanity: the tag must match Cargo.toml's version so the release artifacts
      # and the Homebrew formula don't drift apart.
      - name: verify tag matches Cargo.toml version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # x86_64 binaries can't run on the arm64 macOS runner that built them.
      - name: smoke (--version)
        if: matrix.target != 'x86_64-apple-darwin'
        run: ./target/${{ matrix.target }}/release/jlic --version

      - name: strip + archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          archive="jlic-${tag}-${TARGET}.tar.gz"
          bin="target/${TARGET}/release/jlic"

          # Best-effort strip — only meaningful on Linux GNU; macOS already
          # strips via the release profile config.
          if [[ "$TARGET" == *linux* ]]; then
            strip "$bin" || true
          fi

          # Man page and completions are generated by the binary itself, so
          # they are only produced on natively runnable targets. The formula
          # installs whatever the archive happens to carry.
          staging="staging"
          mkdir -p "$staging"
          cp "$bin" "$staging/"
          if [[ "$TARGET" != "x86_64-apple-darwin" ]]; then
            mkdir -p "$staging/completions" "$staging/man"
            for sh in bash zsh fish; do
              "$bin" completions "$sh" > "$staging/completions/jlic.$sh"
            done
            "$bin" man > "$staging/man/jlic.1"
          fi

          tar -czf "$archive" -C "$staging" .
          shasum -a 256 "$archive" | tee "${archive}.sha256"

          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Collect artifacts, compute SHAs, publish a GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.collect.outputs.version }}
      sha_aarch64_darwin: ${{ steps.collect.outputs.sha_aarch64_darwin }}
      sha_x86_64_darwin: ${{ steps.collect.outputs.sha_x86_64_darwin }}
      sha_x86_64_linux: ${{ steps.collect.outputs.sha_x86_64_linux }}
      sha_aarch64_linux: ${{ steps.collect.outputs.sha_aarch64_linux }}
    steps:
      # Full history so the tag's annotation can be read for the release body.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: collect SHAs
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          declare -A out_keys=(
            [aarch64-apple-darwin]=sha_aarch64_darwin
            [x86_64-apple-darwin]=sha_x86_64_darwin
            [x86_64-unknown-linux-gnu]=sha_x86_64_linux
            [aarch64-unknown-linux-gnu]=sha_aarch64_linux
          )

          for target in "${!out_keys[@]}"; do
            file="dist/jlic-${tag}-${target}.tar.gz"
            sha=$(shasum -a 256 "$file" | awk '{print $1}')
            echo "${out_keys[$target]}=$sha" >> "$GITHUB_OUTPUT"
            echo "$target $sha"
          done

      # Auto-generated notes only list merged PRs, which says nothing on a first
      # release. The tag's own annotation carries the actual summary.
      #
      # The heredoc delimiter is randomised: it is spliced around text that
      # comes from the tag annotation, and a fixed marker could be reproduced
      # there to close the block early and forge further step outputs.
      - name: compose release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.collect.outputs.version }}
        run: |
          set -euo pipefail
          delim="RELEASE_NOTES_$(openssl rand -hex 16)"
          {
            echo "body<<$delim"
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME"
            cat <<EOF

          ## Install

          \`\`\`bash
          brew install jtprogru/tap/jlic
          cargo install jlic --version $VERSION
          \`\`\`

          Archives below are \`.tar.gz\` per target, each with its \`.sha256\` sum.
          EOF
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          draft: false
          # any tag like v1.2.3-rc1 is auto-marked as pre-release
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ---------------------------------------------------------------------------
  # 3. Update jtprogru/homebrew-tap with the new Formula/jlic.rb.
  # ---------------------------------------------------------------------------
  homebrew:
    name: homebrew tap
    needs: release
    # Don't push to the tap for pre-release tags — they shouldn't ship to users.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # Read-only here: the tap is written to with a PAT, not with GITHUB_TOKEN.
    permissions:
      contents: read
    steps:
      - name: checkout jlic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: jlic
          persist-credentials: false

      - name: checkout homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: jtprogru/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      # Every value below ends up inside a Ruby file that runs on the machine of
      # anyone doing `brew install`, so each one is checked against its expected
      # shape before substitution: a stray `#{...}` would be code execution.
      - name: render Formula/jlic.rb
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA_AARCH64_DARWIN: ${{ needs.release.outputs.sha_aarch64_darwin }}
          SHA_X86_64_DARWIN: ${{ needs.release.outputs.sha_x86_64_darwin }}
          SHA_X86_64_LINUX: ${{ needs.release.outputs.sha_x86_64_linux }}
          SHA_AARCH64_LINUX: ${{ needs.release.outputs.sha_aarch64_linux }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::unexpected version: $VERSION"
            exit 1
          fi
          for sha in "$SHA_AARCH64_DARWIN" "$SHA_X86_64_DARWIN" \
                     "$SHA_X86_64_LINUX" "$SHA_AARCH64_LINUX"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::unexpected sha256: $sha"
              exit 1
            fi
          done

          mkdir -p homebrew-tap/Formula
          envsubst < jlic/.github/templates/jlic.rb.tpl > homebrew-tap/Formula/jlic.rb
          cat homebrew-tap/Formula/jlic.rb

      - name: commit & push
        working-directory: homebrew-tap
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/jlic.rb
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "jlic ${VERSION}"
          git push

  # ---------------------------------------------------------------------------
  # 4. Publish the crate to crates.io.
  # ---------------------------------------------------------------------------
  crates-io:
    name: crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set, skipping crates.io publish"
            exit 0
          fi
          cargo publish --locked
