[package]
name = "jlic"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Generate LICENSE files for open source projects: MIT, Apache-2.0, GPL-3.0-or-later, BSD-3-Clause, MPL-2.0, ISC, WTFPL"
authors = ["Mikhail Savin <jtprogru@gmail.com>"]
license = "MIT"
repository = "https://github.com/jtprogru/jlic"
homepage = "https://github.com/jtprogru/jlic"
documentation = "https://docs.rs/jlic"
readme = "README.md"
keywords = ["license", "spdx", "cli", "opensource", "generator"]
categories = ["command-line-utilities", "development-tools"]
# assets/spdx is needed by the test suite, so it stays in the package.
exclude = [".github/**", "dist/**", "scripts/**"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
serde_json = { version = "1.0", optional = true }
thiserror = "2.0"
time = { version = "0.3", features = ["local-offset"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
serde_json = "1.0"
tempfile = "3.27.0"

[features]
default = ["json"]
json = ["dep:serde_json"]

[lib]
name = "jlic"
path = "src/lib.rs"

[[bin]]
name = "jlic"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
